[package]
name = "agent-kanban"
version = "0.1.0"
edition = "2021"
description = "Multi-agent project management kanban with MCP + HTTP, zero external runtime deps"

[[bin]]
name = "agent-kanban"
path = "src/main.rs"

[dependencies]
# async web server
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-std", "io-util", "sync", "time"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace"] }
# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# storage: bundled sqlite (no system lib dependency -> easy cross-compile / single binary)
rusqlite = { version = "0.31", features = ["bundled"] }
# ids / time
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
# cli
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
